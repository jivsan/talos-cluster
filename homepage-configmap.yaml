apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: ORYXSERVER
    description: Homelab command center
    favicon: https://cdn-icons-png.flaticon.com/512/2933/2933245.png
    theme: dark
    color: slate
    language: en
    iconStyle: theme
    headerStyle: boxedWidgets
    target: _blank
    fullWidth: true
    useEqualHeights: true
    bookmarksStyle: icons
    statusStyle: dot
    disableCollapse: false
    hideVersion: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: false
    background:
      image: https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=2400&q=80
      opacity: 22
    cardBlur: md
    layout:
      Media & Entertainment:
        tab: Media
        style: row
        columns: 3
        icon: mdi-play-circle-outline
      Cloud & Productivity:
        tab: Workspace
        style: row
        columns: 2
        icon: mdi-cloud-outline
      Development:
        tab: Workspace
        style: row
        columns: 3
        icon: mdi-code-braces
      Monitoring & Management:
        tab: Platform
        style: row
        columns: 3
        icon: mdi-chart-box-outline
      Infrastructure:
        tab: Platform
        style: row
        columns: 4
        icon: mdi-server-network
      Utilities:
        tab: Toolkit
        style: row
        columns: 2
        icon: mdi-toolbox-outline
      Homelab Resources:
        tab: Docs
        style: row
        columns: 3
        icon: mdi-book-open-variant

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: talos-cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - openmeteo:
        label: Elverum
        latitude: 60.88
        longitude: 11.56
        timezone: Europe/Oslo
        units: metric

  services.yaml: |
    - Media & Entertainment:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.oryxserver.org
            description: Media streaming server
            siteMonitor: https://jellyfin.oryxserver.org
        - Crafty Controller:
            icon: crafty-controller.png
            href: https://crafty.oryxserver.org
            description: Minecraft server management
            siteMonitor: https://crafty.oryxserver.org
        - Immich:
            icon: immich.png
            href: https://photos.oryxserver.org
            description: Photo and video management with AI
            siteMonitor: https://photos.oryxserver.org

    - Cloud & Productivity:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.oryxserver.org
            description: Cloud storage and collaboration
            siteMonitor: https://nextcloud.oryxserver.org
        - SearXNG:
            icon: searxng.png
            href: https://search.oryxserver.org
            description: Private metasearch engine
            siteMonitor: http://searxng.searxng.svc.cluster.local:8080

    - Development:
        - Code Server:
            icon: vscode.png
            href: https://code.oryxserver.org
            description: VS Code in the browser
            siteMonitor: https://code.oryxserver.org
        - JupyterLab:
            icon: jupyter.png
            href: https://jupyter.oryxserver.org
            description: Data science notebooks
            siteMonitor: https://jupyter.oryxserver.org
        - Discord Bot:
            icon: discord.png
            href: https://discord.com
            description: JivBot and Ollama assistant

    - Monitoring & Management:
        - Rancher:
            icon: rancher.png
            href: https://rancher.oryxserver.org
            description: Kubernetes cluster management
            siteMonitor: https://rancher.oryxserver.org
        - Grafana:
            icon: grafana.png
            href: http://10.0.0.16:3000
            description: Metrics and dashboards
            siteMonitor: http://10.0.0.16:3000
        - Pi-hole:
            icon: pi-hole.png
            href: http://10.0.0.4/admin
            description: DNS and ad blocking
            siteMonitor: http://10.0.0.4

    - Infrastructure:
        - Proxmox (Thor):
            icon: proxmox.png
            href: https://10.0.0.2:8006
            description: Node 1 with SSD storage
            siteMonitor: https://10.0.0.2:8006
        - Proxmox (Hella):
            icon: proxmox.png
            href: https://10.0.0.3:8006
            description: Node 2 with HDD storage
            siteMonitor: https://10.0.0.3:8006
        - TrueNAS:
            icon: truenas.png
            href: http://10.0.0.6
            description: ZFS storage on vault pool
            siteMonitor: http://10.0.0.6
        - pfSense:
            icon: pfsense.png
            href: https://10.0.0.1
            description: Firewall and router
            siteMonitor: https://10.0.0.1

    - Utilities:
        - IT Tools:
            icon: it-tools.png
            href: https://tools.oryxserver.org
            description: Developer utility collection
            siteMonitor: https://tools.oryxserver.org
        - Homepage:
            icon: homepage.png
            href: https://home.oryxserver.org
            description: The ORYXSERVER dashboard
            siteMonitor: https://home.oryxserver.org

  bookmarks.yaml: |
    - Homelab Resources:
        - Talos Docs:
            - icon: si-kubernetes
              href: https://www.talos.dev/v1.12/
        - Kubernetes Docs:
            - icon: si-kubernetes
              href: https://kubernetes.io/docs/
        - Helm Charts:
            - icon: si-helm
              href: https://artifacthub.io/

  custom.css: |
    :root {
      --oryx-card-radius: 1.25rem;
      --oryx-border: rgba(148, 163, 184, 0.16);
      --oryx-surface: rgba(15, 23, 42, 0.58);
      --oryx-surface-strong: rgba(15, 23, 42, 0.82);
      --oryx-shadow: 0 18px 50px rgba(2, 6, 23, 0.34);
    }

    body {
      letter-spacing: 0.01em;
    }

    .container, .relative.container {
      max-width: 1700px;
    }

    .service-card,
    .bookmark,
    .information-widget,
    .services-group > div {
      border-radius: var(--oryx-card-radius) !important;
    }

    .service-card,
    .bookmark,
    .information-widget {
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.82)) !important;
      border: 1px solid var(--oryx-border) !important;
      box-shadow: var(--oryx-shadow) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .service-card:hover,
    .bookmark:hover,
    .information-widget:hover {
      transform: translateY(-2px);
      border-color: rgba(96, 165, 250, 0.34) !important;
      box-shadow: 0 22px 60px rgba(2, 6, 23, 0.42) !important;
    }

    .service-card a,
    .bookmark a {
      text-decoration: none !important;
    }

    .group-title,
    .section-header {
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tabs {
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .tabs a,
    .tabs button {
      border-radius: 9999px !important;
      background: rgba(15, 23, 42, 0.72) !important;
      border: 1px solid rgba(148, 163, 184, 0.18) !important;
    }

    .tabs a[aria-selected="true"],
    .tabs button[aria-selected="true"] {
      background: rgba(51, 65, 85, 0.94) !important;
      border-color: rgba(96, 165, 250, 0.45) !important;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.18);
    }

    .status, .status-dot {
      filter: saturate(1.1);
    }

    .service-description,
    .bookmark-description {
      opacity: 0.82;
    }

  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
