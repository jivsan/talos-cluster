apiVersion: v1
kind: Namespace
metadata:
  name: external
---
# TrueNAS
apiVersion: v1
kind: Service
metadata:
  name: truenas
  namespace: external
spec:
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: truenas
  namespace: external
subsets:
  - addresses:
      - ip: 10.0.0.6
    ports:
      - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: truenas
  namespace: external
spec:
  ingressClassName: traefik
  rules:
    - host: truenas.oryxserver.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: truenas
                port:
                  number: 80
  tls:
    - hosts:
        - truenas.oryxserver.org
      secretName: wildcard-oryxserver-tls
---
# pfSense
apiVersion: v1
kind: Service
metadata:
  name: pfsense
  namespace: external
spec:
  ports:
    - port: 443
      targetPort: 443
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pfsense
  namespace: external
subsets:
  - addresses:
      - ip: 10.0.0.1
    ports:
      - port: 443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pfsense
  namespace: external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pfsense.oryxserver.org`)
      kind: Rule
      services:
        - name: pfsense
          port: 443
          scheme: https
          serversTransport: pfsense-transport
  tls:
    secretName: wildcard-oryxserver-tls
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pfsense-transport
  namespace: external
spec:
  insecureSkipVerify: true
---
