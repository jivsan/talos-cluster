apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: crafty-transport
  namespace: crafty
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crafty
  namespace: crafty
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`crafty.oryxserver.org`)
      kind: Rule
      services:
        - name: crafty-web
          port: 8443
          scheme: https
          serversTransport: crafty-crafty-transport@kubernetescrd
  tls:
    secretName: wildcard-oryxserver-tls
