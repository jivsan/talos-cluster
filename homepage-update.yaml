apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
data:
  settings.yaml: |
    title: ORYXSERVER
    favicon: https://cdn-icons-png.flaticon.com/512/2933/2933245.png
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Media & Entertainment:
        style: row
        columns: 3
        icon: mdi-multimedia
      Cloud & Productivity:
        style: row
        columns: 2
        icon: mdi-cloud
      Development:
        style: row
        columns: 3
        icon: mdi-code-braces
      Monitoring & Management:
        style: row
        columns: 3
        icon: mdi-monitor-dashboard
      Infrastructure:
        style: row
        columns: 4
        icon: mdi-server-network
      Utilities:
        style: row
        columns: 2
        icon: mdi-toolbox
    cardBlur: md
    disableCollapse: false
    hideVersion: true
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "talos-cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hour12: false
    - openmeteo:
        label: Elverum
        latitude: 60.88
        longitude: 11.56
        timezone: Europe/Oslo
        units: metric
  services.yaml: |
    - Media & Entertainment:
        - Jellyfin:
            icon: jellyfin.png
            href: https://jellyfin.oryxserver.org
            description: Media streaming server
            siteMonitor: https://jellyfin.oryxserver.org
            statusStyle: dot
        - Crafty Controller:
            icon: crafty-controller.png
            href: https://crafty.oryxserver.org
            description: Minecraft server management
            siteMonitor: https://crafty.oryxserver.org
            statusStyle: dot
        - Immich:
            icon: immich.png
            href: https://photos.oryxserver.org
            description: Photo & video management with AI
            siteMonitor: https://photos.oryxserver.org
            statusStyle: dot
    - Cloud & Productivity:
        - Nextcloud:
            icon: nextcloud.png
            href: https://nextcloud.oryxserver.org
            description: Cloud storage & collaboration
            siteMonitor: https://nextcloud.oryxserver.org
            statusStyle: dot
        - SearXNG:
            icon: searxng.png
            href: https://search.oryxserver.org
            description: Private metasearch engine
            siteMonitor: http://searxng.searxng.svc.cluster.local:8080
            statusStyle: dot
    - Development:
        - Code Server:
            icon: vscode.png
            href: https://code.oryxserver.org
            description: VS Code in the browser
            siteMonitor: https://code.oryxserver.org
            statusStyle: dot
        - JupyterLab:
            icon: jupyter.png
            href: https://jupyter.oryxserver.org
            description: Data science notebooks
            siteMonitor: https://jupyter.oryxserver.org
            statusStyle: dot
        - Discord Bot:
            icon: discord.png
            href: https://discord.com
            description: JivBot — AI assistant (Ollama)
            statusStyle: dot
    - Monitoring & Management:
        - Rancher:
            icon: rancher.png
            href: https://rancher.oryxserver.org
            description: Kubernetes cluster management
            siteMonitor: https://rancher.oryxserver.org
            statusStyle: dot
        - Grafana:
            icon: grafana.png
            href: http://10.0.0.16:3000
            description: Metrics & dashboards
            siteMonitor: http://10.0.0.16:3000
            statusStyle: dot
        - Pi-hole:
            icon: pi-hole.png
            href: http://10.0.0.4/admin
            description: DNS & ad blocking
            siteMonitor: http://10.0.0.4
            statusStyle: dot
    - Infrastructure:
        - Proxmox (Thor):
            icon: proxmox.png
            href: https://10.0.0.2:8006
            description: Node 1 — SSD storage
            siteMonitor: https://10.0.0.2:8006
            statusStyle: dot
        - Proxmox (Hella):
            icon: proxmox.png
            href: https://10.0.0.3:8006
            description: Node 2 — HDD storage
            siteMonitor: https://10.0.0.3:8006
            statusStyle: dot
        - TrueNAS:
            icon: truenas.png
            href: http://10.0.0.6
            description: ZFS storage — vault pool
            siteMonitor: http://10.0.0.6
            statusStyle: dot
        - pfSense:
            icon: pfsense.png
            href: https://10.0.0.1
            description: Firewall & router
            siteMonitor: https://10.0.0.1
            statusStyle: dot
    - Utilities:
        - IT Tools:
            icon: it-tools.png
            href: https://tools.oryxserver.org
            description: Developer utility collection
            siteMonitor: https://tools.oryxserver.org
            statusStyle: dot
        - Homepage:
            icon: homepage.png
            href: https://home.oryxserver.org
            description: This dashboard
            statusStyle: dot
  bookmarks.yaml: |
    - Homelab Resources:
        - Talos Docs:
            - icon: si-kubernetes
              href: https://www.talos.dev/v1.12/
        - Kubernetes Docs:
            - icon: si-kubernetes
              href: https://kubernetes.io/docs/
        - Helm Charts:
            - icon: si-helm
              href: https://artifacthub.io/
  docker.yaml: ""
  kubernetes.yaml: |
    mode: cluster
