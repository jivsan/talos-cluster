apiVersion: v1
kind: Namespace
metadata:
  name: nexterm
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexterm-data-pvc
  namespace: nexterm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexterm
  namespace: nexterm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nexterm
  template:
    metadata:
      labels:
        app: nexterm
    spec:
      containers:
        - name: nexterm
          image: germannewsmaker/nexterm:1.2.0-BETA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6989
          env:
            - name: NODE_ENV
              value: "production"
            - name: SERVER_PORT
              value: "6989"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: nexterm-secrets
                  key: ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: 6989
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 6989
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nexterm-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nexterm
  namespace: nexterm
spec:
  selector:
    app: nexterm
  ports:
    - name: http
      port: 6989
      targetPort: 6989
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexterm
  namespace: nexterm
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: traefik-crowdsec@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: nexterm.oryxserver.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nexterm
                port:
                  number: 6989
  tls:
    - hosts:
        - nexterm.oryxserver.org
      secretName: wildcard-oryxserver-tls
