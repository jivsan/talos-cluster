deployment:
  replicas: 2

service:
  type: LoadBalancer

ingressRoute:
  dashboard:
    enabled: false

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true

ports:
  web:
    port: 8000
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    port: 8443
    exposedPort: 443
  metrics:
    port: 9100
    exposedPort: 9100
    expose:
      default: true

metrics:
  prometheus:
    entryPoint: metrics

logs:
  general:
    level: INFO
  access:
    enabled: true
