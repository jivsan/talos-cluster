apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-runner-data-pvc
  namespace: forgejo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: forgejo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      serviceAccountName: forgejo-runner
      initContainers:
        - name: install-tools
          image: docker:cli
          command: ["/bin/sh", "-c"]
          args:
            - cp /usr/local/bin/docker /shared-bin/docker
          volumeMounts:
            - name: shared-bin
              mountPath: /shared-bin
        - name: install-kubectl
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - cp /opt/bitnami/kubectl/bin/kubectl /shared-bin/kubectl
          volumeMounts:
            - name: shared-bin
              mountPath: /shared-bin
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:6.3.1
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: PATH
              value: /shared-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ ! -f /data/.runner ]; then
                forgejo-runner register \
                  --instance http://forgejo.forgejo.svc.cluster.local:3000 \
                  --token $(RUNNER_TOKEN) \
                  --name k8s-runner \
                  --labels self-hosted:host \
                  --no-interactive
              fi
              forgejo-runner daemon
          envFrom:
            - secretRef:
                name: forgejo-runner-secret
          volumeMounts:
            - name: runner-data
              mountPath: /data
            - name: docker-certs
              mountPath: /certs
            - name: shared-bin
              mountPath: /shared-bin
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: runner-data
          persistentVolumeClaim:
            claimName: forgejo-runner-data-pvc
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        - name: shared-bin
          emptyDir: {}
